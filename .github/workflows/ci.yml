name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装项目与测试依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: 运行测试
        run: python -m pytest
