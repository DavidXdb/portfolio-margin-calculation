[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pb-margin-calculator"
version = "0.1.0"
description = "按 PB 保证金规则（Margin Rule）计算基金投资组合所需保证金的工具"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# 源码放在 src/ 目录（src 布局），打包时只搜 src 下的包
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 把 src 目录加入导入路径，测试里才能 import pb_margin 包
pythonpath = ["src"]
